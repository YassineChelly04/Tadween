[package]
name = "tadween"
version = "1.0.0"
description = "Tadween: an encrypted, local-first notes app for Arabic and Latin writing."
edition = "2021"
rust-version = "1.80"

[lib]
name = "tadween_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
calamine = { version = "0.31", default-features = false, features = ["dates"] }
chrono = { version = "0.4", default-features = false }
# Dictation: microphone capture and on-device speech recognition.
cpal = "0.18"
sherpa-onnx = "=1.13.8"

[dev-dependencies]
tempfile = "3"

# Key derivation is deliberately expensive; keep it fast even in debug builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
